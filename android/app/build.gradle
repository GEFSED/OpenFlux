plugins {
    id "com.android.application"
}

android {
    namespace "io.openflux.app"
    compileSdk 35

    defaultConfig {
        applicationId "io.openflux.app"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "1.0.0"

    }

    splits {
        abi {
            enable true
            reset()
            if (System.getenv("CANDIDATE_ARM64_ONLY") == "1") {
                include "arm64-v8a"
                universalApk false
            } else {
                include "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
                universalApk true
            }
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        candidate {
            initWith debug
            applicationIdSuffix ".candidate"
            versionNameSuffix "-candidate.1"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "candidate") {
            variant.outputs.all { output -> output.versionCodeOverride = 11 }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation files("libs/openflux.aar")
    implementation "com.google.zxing:core:3.5.3"
}
