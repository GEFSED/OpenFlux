plugins {
    id "com.android.application"
}

android {
    namespace "io.openflux.app"
    compileSdk 35

    defaultConfig {
        applicationId "io.openflux.app"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "1.0.0"
        manifestPlaceholders = [appLabel: "OpenFlux"]
        buildConfigField "boolean", "PERF_LAB", "false"
        buildConfigField "String", "PERF_COMMIT", '"' + (System.getenv("GITHUB_SHA") ?: "local") + '"'
    }

    // Only the diagnostic build opts into an arm64-only artifact.
    def diagnosticArm64 = System.getenv("PERFLAB_ARM64_ONLY") == "1"
    splits {
        abi {
            enable true
            reset()
            if (diagnosticArm64) { include "arm64-v8a" }
            else { include "arm64-v8a", "armeabi-v7a", "x86_64", "x86" }
            universalApk !diagnosticArm64
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        perflab {
            initWith debug
            applicationIdSuffix ".perflab"
            versionNameSuffix "-perflab.4"
            manifestPlaceholders = [appLabel: "OpenFlux Perf Lab"]
            buildConfigField "boolean", "PERF_LAB", "true"
            matchingFallbacks = ["debug"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets {
        test.resources.srcDir(rootProject.file("../testsupport/tunshapes"))
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation files("libs/openflux.aar")
    implementation "com.google.zxing:core:3.5.3"
}

// Keep ordinary v1.0.0 versioning unchanged. This is Perf Lab wrapper-order retest #4.
android.applicationVariants.all { variant ->
    if (variant.buildType.name == "perflab") {
        variant.outputs.each { output -> output.versionCodeOverride = 13 }
    }
}
