plugins {
    id "com.android.application"
}

android {
    namespace "io.openflux.app"
    compileSdk 35

    defaultConfig {
        applicationId "io.openflux.app"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "1.0.0"
        manifestPlaceholders = [appLabel: "OpenFlux"]
        buildConfigField "boolean", "PERF_LAB", "false"
        buildConfigField "String", "PERF_COMMIT", '"' + (System.getenv("GITHUB_SHA") ?: "local") + '"'
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            universalApk true
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        perflab {
            initWith debug
            applicationIdSuffix ".perflab"
            versionNameSuffix "-perflab"
            manifestPlaceholders = [appLabel: "OpenFlux Perf Lab"]
            buildConfigField "boolean", "PERF_LAB", "true"
            matchingFallbacks = ["debug"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation files("libs/openflux.aar")
    implementation "com.google.zxing:core:3.5.3"
}
