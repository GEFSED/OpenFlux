name: Android Performance Lab
on:
  push:
    branches: [codex/android-volga-perf-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    name: Go and mobile tests, race, vet, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - name: Check committed diff
        run: git diff --check f4bcfeb3751626cfa4c6ca158ef4cb26692636da HEAD
      - name: Verify transport, guard and historical configs are unchanged
        shell: bash
        run: |
          git diff --exit-code f4bcfeb3751626cfa4c6ca158ef4cb26692636da HEAD -- transport mobile/mobile.go mobile/baseline_v100.go testsupport android/app/src/main/java/io/openflux/app/OpenFluxTunnelService.java android/app/src/main/java/io/openflux/app/ReturnPathStatus.java android/app/src/main/java/io/openflux/app/SecureSettings.java
          python3 - <<'PY'
          import pathlib, subprocess
          path = 'mobile/perf_profiles.go'
          before = subprocess.check_output(['git', 'show', 'f4bcfeb3751626cfa4c6ca158ef4cb26692636da:' + path])
          after = pathlib.Path(path).read_bytes()
          additions = (
              (b'case "optimized", "balanced",', b'case "balanced",'),
              (b'\t// A canonical UI name for the measured .7 candidate, with no retuning.\n\t// Keep normalization separate so diagnostics retain the selected name.\n\tif name == "optimized" {\n\t\treturn profileConfig("throughput_w32_429guard")\n\t}\n', b''),
          )
          for added, replacement in additions:
              assert after.count(added) == 1, 'unexpected alias shape'
              after = after.replace(added, replacement)
          assert after == before, 'historical config implementation changed'
          PY
          echo "TRANSPORT_GUARD_AND_HISTORICAL_CONFIGS_UNCHANGED=PASS"
      - name: Check both modules
        run: |
          go version
          test -z "$(gofmt -l mobile/*.go transport/batched*.go transport/encrypted.go transport/receive_diagnostics*.go transport/perf_config_test.go transport/yandex/vyandex*.go transport/yandex/*diagnostics*.go transport/yandex/rate_limit_429*.go transport/yandex/return_path_test.go transport/yandex/tun_shapes_test.go testsupport/tunshapes/*.go testsupport/productionv060peer/peer.go testsupport/productionv060peer/provenance_test.go transport/yandex/perf*.go)"
          for module in . mobile; do
            (cd "$module" && go test ./... && go test -race ./... && go vet ./... && go build ./...)
          done
          git diff --check
      - name: Prove compatibility test rejects the old Android constructors
        shell: bash
        run: |
          cp mobile/baseline_v100.go "$RUNNER_TEMP/baseline-fixed.go"
          cp mobile/mobile.go "$RUNNER_TEMP/mobile-fixed.go"
          restore_fixed() {
            cp "$RUNNER_TEMP/baseline-fixed.go" mobile/baseline_v100.go
            cp "$RUNNER_TEMP/mobile-fixed.go" mobile/mobile.go
          }
          trap restore_fixed EXIT
          git show 36aee5302dc702a251c8362adfec25388708a06d:mobile/baseline_v100.go > mobile/baseline_v100.go
          git show 36aee5302dc702a251c8362adfec25388708a06d:mobile/mobile.go > mobile/mobile.go
          if (cd mobile && go test -count=1 -run '^TestProductionV060LegacyCompatibility$/^(baseline|balanced|low_latency|throughput|throughput_current|throughput_mem|throughput_96|throughput_w64|throughput_w48|throughput_w32|throughput_w32_429guard|optimized)$/^AES$' .) > "$RUNNER_TEMP/old-order.log" 2>&1; then
            echo "ERROR: regression test accepted the old wrapper order"
            exit 1
          fi
          cat "$RUNNER_TEMP/old-order.log"
          test "$(grep -c 'client wire frame must begin with OFX/version before the production exit' "$RUNNER_TEMP/old-order.log")" -eq 12
          restore_fixed
          trap - EXIT
          git diff --exit-code -- mobile/baseline_v100.go mobile/mobile.go
          echo "OLD_ORDER_REGRESSION_PROOF=PASS (all twelve Legacy+AES profiles)"
  android:
    needs: go
    env:
      PERFLAB_ARM64_ONLY: "1"
    name: Optimized candidate arm64 APK and Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
      - run: go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - name: Build separate debug-signed Perf Lab application
        run: BUILD_TYPE=perflab GRADLE_BIN="$(command -v gradle)" ./build_android_app.sh
      - run: cd android && gradle --no-daemon testPerflabUnitTest
      - name: Verify application identity and checksums
        run: |
          for apk in dist/*-perflab.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$apk.badging.txt"
            grep -q "package: name='io.openflux.app.perflab'" "$apk.badging.txt"
            grep -q "versionCode='17' versionName='1.0.0-perflab.8'" "$apk.badging.txt"
            grep -q "application-label:'OpenFlux Perf Lab'" "$apk.badging.txt"
            grep -Fxq "native-code: 'arm64-v8a'" "$apk.badging.txt"
          done
          cd dist
          sha256sum *-perflab.apk > SHA256SUMS
          cat SHA256SUMS
          printf 'Commit: %s\nPackage: io.openflux.app.perflab\nDebug signed, Optimized candidate; exact alias of guarded w32. Legacy + user2; normal browsing smoke, no Speedtest required.\n' "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-Android-PerfLab-${{ github.sha }}
          path: |
            dist/*-perflab.apk
            dist/*.badging.txt
            dist/SHA256SUMS
            dist/BUILD.txt
          if-no-files-found: error
          retention-days: 30
