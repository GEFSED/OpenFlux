name: Ordinary Android candidate
on:
  push:
    branches: [codex/android-production-optimized]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    name: Linux root and mobile tests, race, vet, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - name: Verify exact base, unchanged algorithms and source scope
        run: |
          git diff --check 8566f727c8238436728758f139130cef433147b7 HEAD
          python3 scripts/verify_android_candidate.py
      - name: Report canonical Go formatting without changing build sources
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          paths = ["mobile/packet_modes.go", "mobile/performance_modes.go", "mobile/performance_modes_test.go", "mobile/packet_modes_test.go", "mobile/production_legacy_test.go", "mobile/standard_compat_test.go", "transport/configured_batched.go", "transport/configured_batched_test.go", "transport/yandex/configured_volga.go", "transport/yandex/configured_lifecycle_test.go", "transport/yandex/local_http_test.go", "transport/yandex/http_failure_diagnostics_test.go"]
          changed = {}
          for path in paths:
              source = pathlib.Path(path).read_bytes()
              formatted = subprocess.check_output(["gofmt"], input=source)
              if formatted != source:
                  changed[path] = base64.b64encode(formatted).decode()
          print("GO_FORMAT_SOURCE_BUNDLE=" + json.dumps(changed, separators=(",", ":")))
          PY
      - name: Validate both Go modules on Linux
        run: |
          go version
          for module in . mobile; do
            (cd "$module" && go test ./... && go test -race ./... && go vet ./... && go build ./...)
          done
          git diff --check
      - name: Verify production compatibility rejects old wrapper order
        run: |
          cp mobile/packet_modes.go "$RUNNER_TEMP/packet-modes-fixed.go"
          restore_fixed() { cp "$RUNNER_TEMP/packet-modes-fixed.go" mobile/packet_modes.go; }
          trap restore_fixed EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/packet_modes.go')
          s = p.read_text()
          start = s.rfind('\n', 0, s.index('if secret != "" {', s.index('func wrapModeTransport'))) + 1
          legacy = s.rfind('\n', 0, s.index('if codec == "legacy" {', start)) + 1
          end = s.rfind('\n', 0, s.index('return inner, nil', legacy)) + 1
          s = s[:start] + s[legacy:end] + s[start:legacy] + s[end:]
          p.write_text(s)
          PY
          if (cd mobile && go test -count=1 -run '^TestProductionV060LegacyCompatibility$/(speed|optimized)/AES$' .) > "$RUNNER_TEMP/old-order.log" 2>&1; then
            echo "ERROR: old wrapper order accepted"
            exit 1
          fi
          cat "$RUNNER_TEMP/old-order.log"
          test "$(grep -c 'client wire frame must begin with OFX/version before the production exit' "$RUNNER_TEMP/old-order.log")" -eq 2
          restore_fixed
          trap - EXIT
          git diff --exit-code
  android:
    needs: go
    name: Ordinary candidate Java tests and arm64 APK
    runs-on: ubuntu-latest
    env:
      CANDIDATE_ARM64_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
      - run: go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - name: Build isolated debug-signed candidate
        run: BUILD_TYPE=candidate GRADLE_BIN="$(command -v gradle)" ./build_android_app.sh
      - name: Run Java unit tests
        run: cd android && gradle --no-daemon testCandidateUnitTest
      - name: Verify identity, arm64, signature and SHA-256
        run: |
          apk=dist/OpenFlux-android-arm64-v8a-candidate.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$apk.badging.txt"
          grep -q "package: name='io.openflux.app.candidate'" "$apk.badging.txt"
          grep -q "versionCode='11' versionName='1.0.0-candidate.1'" "$apk.badging.txt"
          grep -q "application-label:'OpenFlux Candidate'" "$apk.badging.txt"
          grep -Fxq "native-code: 'arm64-v8a'" "$apk.badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee dist/SIGNING.txt
          grep -q "CN=Android Debug" dist/SIGNING.txt
          cd dist
          sha256sum *-candidate.apk | tee SHA256SUMS
          printf 'Commit: %s\nPackage: io.openflux.app.candidate\nVersion: 1.0.0-candidate.1 (11)\nABI: arm64-v8a\nSigning: CI debug certificate, not upstream signing identity\nSeparate installation; cannot update io.openflux.app in place. No automatic install.\n' "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-Android-Candidate-${{ github.sha }}
          path: |
            dist/*-candidate.apk
            dist/*.badging.txt
            dist/SIGNING.txt
            dist/SHA256SUMS
            dist/BUILD.txt
          if-no-files-found: error
          retention-days: 30
