name: Exit receive diagnostics (Linux only)
on:
  push:
    branches: [codex/exit-receive-diag]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Linux Go tests, race, vet and diagnostic exit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Verify exact source base and diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 081d214300c1067f17f6c0d02f84a8491f1a7b98 HEAD
          git diff --check 081d214300c1067f17f6c0d02f84a8491f1a7b98 HEAD
          git diff --stat 081d214300c1067f17f6c0d02f84a8491f1a7b98 HEAD
          go version
          go env GOOS GOARCH GOAMD64 CGO_ENABLED
      - name: Root module tests
        run: go test ./...
      - name: Root module race tests
        run: go test -race ./...
      - name: Root module vet
        run: go vet ./...
      - name: Root module build
        run: go build ./...
      - name: Shared transport consumer module validation
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./...
      - name: Build separate Linux amd64 diagnostic exit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openflux-diag"
          go build -o "$RUNNER_TEMP/openflux-diag/openflux-diag" .
          {
            printf "SOURCE_SHA="
            git rev-parse HEAD
            printf "PRODUCTION_SOURCE_SHA=081d214300c1067f17f6c0d02f84a8491f1a7b98\n"
            printf "RECEIVE_ORDER=Volga -> AES -> Legacy -> proxy\n"
            go version
            go version -m "$RUNNER_TEMP/openflux-diag/openflux-diag"
          } > "$RUNNER_TEMP/openflux-diag/BUILD-INFO.txt"
          cd "$RUNNER_TEMP/openflux-diag"
          sha256sum openflux-diag | tee SHA256SUMS
          cat BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openflux-exit-receive-diag-linux-amd64
          path: ${{ runner.temp }}/openflux-diag/
          if-no-files-found: error
          retention-days: 7
