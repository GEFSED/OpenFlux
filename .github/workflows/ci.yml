name: Exit TCP ACK latency diagnostics

on:
  push:
    branches: [codex/exit-ack-latency-diag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux exact-source ACK validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whitespace and exact-source verification
        run: |
          git diff --check 081d214300c1067f17f6c0d02f84a8491f1a7b98 HEAD
          git diff --check
          git merge-base --is-ancestor 081d214300c1067f17f6c0d02f84a8491f1a7b98 HEAD
          python3 scripts/ack-diag-verify.py "$RUNNER_TEMP/ack-artifacts"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove nested dependency selection matches frozen graph
        run: python3 scripts/check-mobile-dependency-selection.py
      - name: Production binary provenance and build settings
        run: |
          curl --fail --location --silent --show-error https://github.com/damnurmum/OpenFlux-Android/releases/download/v0.6.0/OpenFlux-linux-amd64 -o "$RUNNER_TEMP/production-openflux"
          printf '%s  %s\n' 08fcf4020cd3c7274c7abd78fe386b40d2fcf8515082d3475ced324ad109217c "$RUNNER_TEMP/production-openflux" | sha256sum --check
          go version
          go version -m "$RUNNER_TEMP/production-openflux" | tee "$RUNNER_TEMP/ack-artifacts/production-build-info.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'ack-artifacts/production-build-info.txt').read_text()
          values = {}
          for line in text.splitlines():
              parts = line.strip().split('\t', 1)
              if len(parts) == 2 and parts[0] == 'build' and '=' in parts[1]:
                  key, value = parts[1].split('=', 1)
                  values[key] = value
          assert values['vcs.revision'] == '081d214300c1067f17f6c0d02f84a8491f1a7b98'
          assert values['vcs.modified'] == 'false'
          assert values['GOOS'] == 'linux' and values['GOARCH'] == 'amd64'
          assert values['CGO_ENABLED'] in ('0', '1')
          assert text.splitlines()[0].endswith('go1.26.4')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CGO_ENABLED=' + values['CGO_ENABLED'] + '\n')
              env.write('GOAMD64=' + values.get('GOAMD64', 'v1') + '\n')
          PY
      - name: Deterministic correlator, stress, replay and memory evidence
        run: |
          set -o pipefail
          go test -v ./internal/ackdiag | tee "$RUNNER_TEMP/ack-artifacts/correlator-tests.txt"
      - name: Export frozen schema 3 and startup/bootstrap schema 6 fixtures; validate readiness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          export ACK_SCHEMA_FIXTURE_DIR="$RUNNER_TEMP/ack-schema3-fixtures"
          export ACK_STARTUP_FIXTURE_DIR="$RUNNER_TEMP/ack-startup-fixtures"
          export ACK_BOOTSTRAP_FIXTURE_DIR="$RUNNER_TEMP/ack-bootstrap-fixtures"
          export ACK_STRUCTURE_FIXTURE_DIR="$RUNNER_TEMP/ack-structure-fixtures"
          go test -count=1 -run '^TestExportSchema3Fixtures$' -v ./internal/ackdiag
          go test -count=1 -run '^TestExportStartupFixtures$' -v ./internal/ackdiag
          go test -count=1 -run '^TestExportBootstrapFixtures$' -v ./internal/ackdiag
          go test -count=1 -run '^TestExportStructureFixtures$' -v ./internal/ackdiag
          python3 -m unittest discover -s scripts/ack-readiness -v 2>&1 | tee "$RUNNER_TEMP/ack-artifacts/schema3-validator-tests.txt"
          cp docs/ACK_SCHEMA3_READINESS.md "$RUNNER_TEMP/ack-artifacts/"
          cp docs/ACK_STARTUP_OBSERVABILITY.md "$RUNNER_TEMP/ack-artifacts/"
          cp docs/BOOTSTRAP_RESPONSE_OBSERVABILITY.md "$RUNNER_TEMP/ack-artifacts/"
          cp -r "$ACK_BOOTSTRAP_FIXTURE_DIR" "$RUNNER_TEMP/ack-artifacts/"
          cp -r "$ACK_STRUCTURE_FIXTURE_DIR" "$RUNNER_TEMP/ack-artifacts/"
          cp docs/BOOTSTRAP_STRUCTURE_SCHEMA6.md "$RUNNER_TEMP/ack-artifacts/"
      - name: Root tests
        run: go test ./...
      - name: Root race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Root vet and build
        run: |
          go vet ./...
          go build ./...
      - name: Mobile tests race vet and build
        working-directory: mobile
        run: |
          go test ./...
          CGO_ENABLED=1 go test -race ./...
          go vet ./...
          go build ./...
      - name: Build separate diagnostic Linux amd64 binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/ack-artifacts/openflux-ack-diag" .
          go version -m "$RUNNER_TEMP/ack-artifacts/openflux-ack-diag" > "$RUNNER_TEMP/ack-artifacts/diagnostic-build-info.txt"
          test -z "$(git status --porcelain)"
          git diff --check
          cp docs/EXIT_ACK_LATENCY_DIAG.md "$RUNNER_TEMP/ack-artifacts/"
          cd "$RUNNER_TEMP/ack-artifacts"
          sha256sum openflux-ack-diag | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: openflux-ack-diag-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/ack-artifacts/
          if-no-files-found: error
          retention-days: 14
